[package]
name = "test_defaults1"
publish = false
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
tsify = { path = "../..", version = "*" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# `test_defaults_js1` shares this crate's `entry_point.rs` and turns this
# on. Declared here as well so the `cfg` in the shared source is known to both.
[features]
js = ["tsify/js"]

[lib]
path = "entry_point.rs"
crate-type = ["cdylib"]

[build-dependencies]
wasm-bindgen-cli = "0.2"
